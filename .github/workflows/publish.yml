# DO NOT RENAME THIS FILE.
# NPM Trusted publishing (OIDC) requires this file to be named `publish.yml` and located in `.github/workflows/`.

name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Create Changeset PR
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      # Trusted publishing (OIDC) requires npm >= 11.5.1 — newer than what's
      # bundled with some Node LTS releases.
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Build type declarations
        run: yarn tsc

      - name: Build packages
        run: yarn build:all

      - name: Create Release Pull Request
        uses: changesets/action@v1
        with:
          version: yarn run version
          publish: yarn run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
